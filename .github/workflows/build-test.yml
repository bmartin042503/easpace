name: "easpace - Build and test"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call: 
  
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    name: "Build and test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore easpace.slnx

      - name: Build solution (Release)
        run: >
          dotnet build easpace.slnx
          --configuration Release
          --no-restore

      - name: Run tests (Release)
        run: >
          dotnet test
          --project src/easpace.Tests/easpace.Tests.csproj
          --configuration Release
          --no-build